<!DOCTYPE html>

<html lang="de">
<head>
    <!-- Metadaten -->
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Tapes</title>
    <link rel="icon" href="../images/ico.png" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Scripts -->
    <script src="../javascript/src.js" defer></script>
    <script src="../javascript/video.js" defer></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/controls.js"></script>
    <script src="../components/solution.js"></script>
    <script src="../javascript/theme.js" defer></script>
    <script type="module" src="../javascript/backend.js" defer></script>

    <script src="https://www.youtube.com/iframe_api" defer></script>
</head>

<body style="min-width: 20.5em">

<header></header>
<my-navbar></my-navbar>


<main>

<!-- Img + Input -->
    <div class="card m-3" >
        <div class="row g-0">
            <div class="col-5 m-1 d-flex justify-content-center align-items-center">
                <img src="../images/duck.png" width="125" class="img-fluid rounded-start" alt="DJ Duck">
            </div>
            <div class="col">
                <div class="card-body">
                    <h5 class="card-title">Code</h5>

                    <form onsubmit="startPlay(); return false;">
                        <div class="input-group mb-3">
                            <input id="code-input" inputmode="numeric" class="form-control" placeholder="123 456" aria-label="Code" aria-describedby="close-btn-span">
                            <span id="close-btn-span" class="input-group-text">
                                <button id="clear-button" class="btn-close" onclick="clearInput()" type="button" aria-label="Close"></button>
                            </span>
                        </div>

                        <button id="play-button" class="w-50 btn btn-outline-primary" type="submit">
                            Play
                            <span id="loading-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                        </button>
                        <button id="repeat-button" type="button" class="btn btn-outline-secondary disabled" onclick="playLastSong()" title="Vorheriges Lied wiedergeben"><i class="fa fa-repeat fa-stack-0x"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Div -->
    <div id="message-div" class="card m-3 bg-danger bg-opacity-75 text-center d-none">
        <p id="message-p" class="mb-1"></p>
    </div>

    <my-controls></my-controls>
    <my-solution></my-solution>

    <div id="video-container" class="d-none"></div>

</main>

<footer></footer>

</body>
</html>
